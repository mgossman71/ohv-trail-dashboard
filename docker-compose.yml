version: "3.8"

services:
  ohv-dashboard:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data        # database persists on host
      - ./templates:/app/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  ohv-scraper:
    build: .
    command: python scheduler.py
    volumes:
      - ./data:/app/data        # shares the same database
      - ./templates:/app/templates
    environment:
      - SCRAPE_INTERVAL_HOURS=12  # minimum is 12 hours — do not set lower
      - DATABASE_PATH=/app/data/trails.db
    restart: unless-stopped     # restart if it crashes
    depends_on:
      - ohv-dashboard
